<style>
/* One screen, nothing to learn: the house, what's on, and one button for the music. */
:root {
  --night: #0b0a09;
  --ink: #f2ebe2;
  --muted: #a3968a;
  --line: #2e2721;
  --accent: #ff6a1f;
  --red: #ff4d4d;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.page {
  min-height: 100svh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
}
.top { display: flex; align-items: center; justify-content: space-between; }
.onair { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 900; font-size: 22px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); }
.onair i { width: 11px; height: 11px; border-radius: 50%; background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
.onair.off { color: var(--muted); }
.onair.off i { background: var(--muted); animation: none; }
@keyframes pulse { 50% { opacity: 0.3; } }
.brand { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.brand b { color: var(--accent); font-weight: 900; transition: color 0.4s; }
.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #060504; }
.stage canvas { display: block; width: 100%; height: 100%; }
.msg { position: absolute; inset: auto 0 0; padding: 10px 14px; font-size: 14px; color: var(--muted);
  background: linear-gradient(transparent, rgba(6, 5, 4, 0.85)); }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: -8px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: background 0.4s; }
.now { display: grid; gap: 4px; }
.kicker { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); transition: color 0.4s; }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(40px, 12vw, 60px); line-height: 0.95; text-transform: uppercase; }
.desc { margin: 6px 0 0; color: var(--muted); }
.sound {
  margin-top: auto; width: 100%; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 12px;
  border: 0; border-radius: 16px; background: var(--accent); color: #140b05; font: 600 19px var(--body); cursor: pointer;
  transition: background 0.4s;
}
.sound svg { width: 26px; height: 26px; fill: currentColor; flex: none; }
.sound[aria-pressed="true"] { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.note { margin: -6px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .onair i { animation: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <span class="onair off" id="onair"><i></i>Live</span>
    <a class="brand" href="../">Pixel<b>home</b></a>
  </header>
  <div class="stage"><canvas id="view" aria-label="The house and its lights, as they are right now"></canvas><div class="msg" id="msg">Connecting to the house…</div></div>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  <section class="now" aria-live="polite">
    <p class="kicker" id="kicker">Live</p>
    <h1 id="title">Just a moment</h1>
    <p class="desc" id="desc">Finding out what the house is playing.</p>
  </section>
  <button class="sound" id="sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" id="soundIcon"></svg><span id="soundText">Tap to hear the music</span></button>
  <p class="note" id="note">The music plays from your phone, in time with the lights.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="live.js"></script>
</body>
</html>
